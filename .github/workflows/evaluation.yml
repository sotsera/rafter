name: Evaluation
run-name: ${{ inputs.nuget-cache-experiment && inputs.nuget-cache-experiment != 'off' && format('Windows cache - {0}', inputs.nuget-cache-experiment) || format('Evaluation - {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nuget-cache-experiment:
        description: Windows-only cache measurement; off runs the normal evaluation
        type: choice
        default: 'off'
        options: ['off', default, runner-temp]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-portable-evaluation:
    name: Linux portable evaluation
    if: inputs.nuget-cache-experiment != 'default' && inputs.nuget-cache-experiment != 'runner-temp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Record environment and portable membership
        run: |
          mkdir -p artifacts
          dotnet --info | tee artifacts/dotnet-info.txt
          cat /etc/os-release | tee artifacts/linux-info.txt
          uname -a | tee -a artifacts/linux-info.txt
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion" > artifacts/runner-image.txt
          dotnet sln Rafter.Portable.slnf list | tee artifacts/portable-projects.txt
          grep -F 'Rafter.UnitTests.csproj' artifacts/portable-projects.txt
          grep -F 'Rafter.IntegrationTests.csproj' artifacts/portable-projects.txt
          if grep -E 'Rafter.WindowsTests|ProcessProbe' artifacts/portable-projects.txt; then
            echo 'Windows projects must be excluded from the portable solution filter.' >&2
            exit 1
          fi

      - name: Restore portable solution
        run: dotnet restore Rafter.Portable.slnf

      - name: Build portable solution
        run: |
          dotnet build Rafter.Portable.slnf --configuration Release --no-restore -bl:artifacts/build.binlog
          test ! -d tests/Rafter.WindowsTests/obj
          test ! -d tests/testassets/processes/obj

      - name: Run ordinary portable tests
        run: dotnet test --solution Rafter.Portable.slnf --configuration Release --no-build --minimum-expected-tests 1 --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results/ordinary

      - name: Run full portable evaluation
        run: dotnet test --solution Rafter.Portable.slnf --configuration Release --no-build -p:IncludeLongRunningTests=true --minimum-expected-tests 1 --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results/full

      - name: Retain portable evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-portable-evaluation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-evaluation:
    name: Windows evaluation
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Select runner-temp NuGet caches for measurement
        if: inputs.nuget-cache-experiment == 'runner-temp'
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'nuget/packages'
          $httpCache = Join-Path $env:RUNNER_TEMP 'nuget/http-cache'
          New-Item -ItemType Directory -Path $packages, $httpCache -Force | Out-Null
          "NUGET_PACKAGES=$packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$httpCache" >> $env:GITHUB_ENV

      - name: Record environment
        shell: pwsh
        env:
          RAFTER_NUGET_CACHE_EXPERIMENT: ${{ inputs.nuget-cache-experiment || 'off' }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet --info | Tee-Object artifacts/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture |
            Out-File artifacts/windows-info.txt
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion" | Tee-Object artifacts/runner-image.txt
          dotnet nuget locals all --list | Tee-Object artifacts/nuget-locations.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            Experiment = $env:RAFTER_NUGET_CACHE_EXPERIMENT
            Packages = $env:NUGET_PACKAGES
            HttpCache = $env:NUGET_HTTP_CACHE_PATH
            RunnerTemp = $env:RUNNER_TEMP
          } | ConvertTo-Json | Tee-Object artifacts/nuget-cache.json

      - name: Restore
        run: dotnet restore Rafter.slnx

      - name: Build
        run: dotnet build Rafter.slnx --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Run ordinary tests
        run: dotnet test --solution Rafter.slnx --configuration Release --no-build --minimum-expected-tests 1 --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results/ordinary

      - name: Run full evaluation
        run: dotnet test --solution Rafter.slnx --configuration Release --no-build -p:IncludeLongRunningTests=true --minimum-expected-tests 1 --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results/full

      - name: Pack local runtime and analyzers
        run: dotnet pack src/Sotsera.Rafter/Sotsera.Rafter.csproj --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Review redirected runtime output
        shell: pwsh
        run: |
          dotnet build tests/testassets/consumers/runtime/project/Consumer.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verification/Verify-RuntimeTerminal.ps1 -RedirectedOnly

      - name: Retain evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-evaluation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
